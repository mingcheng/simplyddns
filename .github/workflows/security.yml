name: security

on:
  push:
    branches:
      - main
      - master
      - develop
      - "release/**"
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  codeql:
    name: Analyze with CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          tools: go

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual

      - name: Build with mise
        env:
          CGO_ENABLED: "0"
        run: mise exec go -- go build ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  govulncheck:
    name: Run govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          tools: go go:golang.org/x/vuln/cmd/govulncheck

      - name: Run govulncheck
        run: mise exec go go:golang.org/x/vuln/cmd/govulncheck -- govulncheck ./...