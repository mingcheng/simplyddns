name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  release:
    name: Verify and publish an existing version tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('refs/tags/{0}', startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version)) || github.ref }}
          persist-credentials: false

      - name: Normalize release version
        id: metadata
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        run: bash scripts/release-version.sh "$RAW_VERSION" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup
        with:
          tools: go make actionlint shellcheck hadolint go:golang.org/x/vuln/cmd/govulncheck

      - name: Check version and prepare release
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          project_version=$(mise exec make -- make --no-print-directory -s version)
          if [[ "$project_version" != "$RELEASE_VERSION" ]]; then
            echo "Tag version $RELEASE_VERSION does not match Makefile version $project_version" >&2
            exit 1
          fi
          mise exec make -- make release VERSION="$RELEASE_VERSION"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          prerelease: ${{ steps.metadata.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/simplyddns_${{ steps.metadata.outputs.version }}_*.tar.gz
            dist/simplyddns_${{ steps.metadata.outputs.version }}_*.zip
            dist/checksums.txt
