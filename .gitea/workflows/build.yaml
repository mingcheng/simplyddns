name: build

on:
  push:
    branches:
      - develop
      - main
      - master
      - "release/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up tools with mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.18
          install_args: go make
          cache: false
          github_token: ""
      - run: mise exec make -- make test vet build
